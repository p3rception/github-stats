<svg id="gh-dark-mode-only" width="520" height="150" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
}

/* Corner brackets instead of a full border. The card sits on a dark page with
   no panel behind it, so a closed 1px rectangle reads as a box drawn round
   nothing; brackets frame the content without claiming to contain it.
   Inset 6px a side, 14px arms. */
.bracket {
  fill: none;
  stroke: rgba(96, 172, 246, 0.45);
  stroke-width: 1px;
}

.title {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 600;
  line-height: 22px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  color: rgba(96, 172, 246, 0.8);
}

.stats {
  display: flex;
}

/* Centred so each label sits under the middle of its own numeral rather
   than ragging left against a column edge. */
.stat {
  flex: 1;
  text-align: center;
  /* Staggered rise on load. The card is an image element, so this plays once
     when it decodes - there is no hover or replay to worry about. */
  animation: rise 0.5s ease-out backwards;
}

.stat:nth-child(2) { animation-delay: 0.08s; }
.stat:nth-child(3) { animation-delay: 0.16s; }

.num {
  display: block;
  font-size: 40px;
  font-weight: 600;
  line-height: 44px;
  /* Tabular figures so the three columns stay optically aligned as the values
     change width run to run. */
  font-variant-numeric: tabular-nums;
  color: #60ACF6;
}

/* Labels carry the accent's job in reverse: small, wide, and quiet, so the
   numeral is the loudest thing in each column. */
.label {
  display: block;
  margin-top: 4px;
  font-size: 16px;
  font-weight: 500;
  line-height: 20px;
  letter-spacing: 0.02em;
  color: rgba(255, 255, 255, 0.55);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .stat {
    animation: none;
  }
}
</style>
<g>
<path class="bracket" d="M8,26 L8,8 L26,8" />
<path class="bracket" d="M494,8 L512,8 L512,26" />
<path class="bracket" d="M512,124 L512,142 L494,142" />
<path class="bracket" d="M26,142 L8,142 L8,124" />
<foreignObject x="20" y="20" width="480" height="110">
<div xmlns="http://www.w3.org/1999/xhtml">

<p class="title">Github Statistics</p>

<div class="stats">
<div class="stat"><span class="num">{{ stars }}</span><span class="label">Stars</span></div>
<div class="stat"><span class="num">{{ forks }}</span><span class="label">Forks</span></div>
<div class="stat"><span class="num">{{ views }}</span><span class="label">Repo Views (14d)</span></div>
</div>

</div>
</foreignObject>
</g>
</svg>
