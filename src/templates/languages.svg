<svg id="gh-dark-mode-only" width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 14px;
  line-height: 21px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: none;
  stroke: #334155;
  stroke-width: 1px;
  rx: 10px;
  ry: 10px;
}


foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #28A2E3;
  fill: #28A2E3;
}


ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  display: inline-flex;
  font-size: 12px;
  margin-right: 1ch;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(-500%);
  animation: slideIn 2s ease-in-out forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 176px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  fill: #4DBCEA;
  margin-right: 0.5ch;
  vertical-align: top;
}


.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 1em;
}


.progress-item {
  outline: 2px solid #334155;
  border-collapse: collapse;
}


.lang {
  font-weight: 600;
  margin-right: 4px;
  color: #FFFFFF;
}


.percent {
  color: #FFFFFF
}

</style>
<g>
<rect x="5" y="5" id="background" />
<g>
<foreignObject x="21" y="17" width="318" height="176">
<div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">

<h2>Languages Used (By File Size)</h2>

<div>
<span class="progress">
{{ progress }}
</span>
</div>

<ul>

{{ lang_list }}

</ul>

</div>
</foreignObject>
</g>
</g>
</svg>
