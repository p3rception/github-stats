<svg id="gh-dark-mode-only" width="360" height="110" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
}

/* Corner brackets instead of a full border. The card sits on a dark page with
   no panel behind it, so a closed 1px rectangle reads as a box drawn round
   nothing; brackets frame the content without claiming to contain it.
   Inset 6px a side, 14px arms. */
.bracket {
  fill: none;
  stroke: rgba(96, 172, 246, 0.45);
  stroke-width: 1px;
}

.title {
  margin: 0 0 14px;
  font-size: 10px;
  font-weight: 600;
  line-height: 14px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(96, 172, 246, 0.8);
}

.stats {
  display: flex;
}

.stat {
  flex: 1;
  /* Staggered rise on load. The card is an image element, so this plays once
     when it decodes - there is no hover or replay to worry about. */
  animation: rise 0.5s ease-out backwards;
}

.stat:nth-child(2) { animation-delay: 0.08s; }
.stat:nth-child(3) { animation-delay: 0.16s; }

.num {
  display: block;
  font-size: 28px;
  font-weight: 600;
  line-height: 32px;
  /* Tabular figures so the three columns stay optically aligned as the values
     change width run to run. */
  font-variant-numeric: tabular-nums;
  color: #60ACF6;
}

/* Labels carry the accent's job in reverse: small, wide, and quiet, so the
   numeral is the loudest thing in each column. */
.label {
  display: block;
  margin-top: 4px;
  font-size: 9px;
  font-weight: 500;
  line-height: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .stat {
    animation: none;
  }
}
</style>
<g>
<path class="bracket" d="M6,20 L6,6 L20,6" />
<path class="bracket" d="M340,6 L354,6 L354,20" />
<path class="bracket" d="M354,90 L354,104 L340,104" />
<path class="bracket" d="M20,104 L6,104 L6,90" />
<foreignObject x="20" y="16" width="320" height="78">
<div xmlns="http://www.w3.org/1999/xhtml">

<p class="title">Github Statistics</p>

<div class="stats">
<div class="stat"><span class="num">131</span><span class="label">Stars</span></div>
<div class="stat"><span class="num">9</span><span class="label">Forks</span></div>
<div class="stat"><span class="num">115</span><span class="label">Views (14d)</span></div>
</div>

</div>
</foreignObject>
</g>
</svg>
